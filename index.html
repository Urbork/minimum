<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>minimum</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafaf8;
      --fg: #1a1a1a;
      --line: rgba(26, 26, 26, 0.25);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111110; --fg: #f2f2ef; --line: rgba(242, 242, 239, 0.3); }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .screen {
      position: relative;
      /* własny kontekst układania — ślad z canvasu rysuje się nad treścią */
      z-index: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 18vw, 12rem);
      font-weight: 300;
      letter-spacing: -0.04em;
    }
    .hint {
      position: absolute;
      left: 50%;
      bottom: 2rem;
      transform: translateX(-50%);
      margin: 0;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      opacity: 0.4;
    }
    .about p {
      max-width: 34rem;
      margin: 0;
      font-size: clamp(1rem, 2.2vw, 1.1875rem);
      font-weight: 300;
      line-height: 1.7;
      text-wrap: pretty;
    }
    #trail {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
      /* dzięki temu biały ślad jest widoczny na jasnym i ciemnym tle */
      mix-blend-mode: difference;
    }
    #clear {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      z-index: 2;
      padding: 0.5rem 0.9rem;
      font: inherit;
      font-size: 0.8125rem;
      letter-spacing: 0.02em;
      color: var(--fg);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.2s ease, border-color 0.2s ease;
    }
    #clear:hover,
    #clear:focus-visible {
      opacity: 1;
      border-color: currentColor;
    }
  </style>
</head>
<body>
  <canvas id="trail"></canvas>

  <section class="screen">
    <h1>minimum</h1>
    <p class="hint">przewiń ↓</p>
  </section>

  <section class="screen about">
    <p>
      minimum to projekt-eksperyment — miejsce na próby z czystym HTML, CSS
      i odrobiną JavaScriptu, bez frameworków i bez procesu budowania.
      Każdy ekran jest jednym pomysłem doprowadzonym do najprostszej działającej
      formy. Ślad, który zostawiasz tu kursorem, jest pierwszym z nich.
    </p>
  </section>

  <button id="clear" type="button" title="Wyczyść ślad (Esc) — przytrzymaj Q, aby wstrzymać rysowanie">wyczyść ślad</button>

  <script>
    (function () {
      var canvas = document.getElementById('trail');
      var button = document.getElementById('clear');
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var last = null;
      var enabled = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var paused = false;

      function clear() {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
        last = null;
      }

      function resize() {
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#ffffff';
        last = null;
      }

      function draw(x, y) {
        if (paused) {
          last = null;
          return;
        }
        if (last) {
          var dx = x - last.x;
          var dy = y - last.y;
          var speed = Math.sqrt(dx * dx + dy * dy);
          // szybszy ruch = cieńsza kreska
          ctx.lineWidth = Math.max(2, 14 - speed * 0.35);
          ctx.beginPath();
          ctx.moveTo(last.x, last.y);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
        last = { x: x, y: y };
      }

      function fade() {
        // powolne zanikanie — ślad zostaje przez kilka sekund
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fillStyle = 'rgba(0, 0, 0, 0.02)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
        requestAnimationFrame(fade);
      }

      button.addEventListener('click', function () {
        clear();
        button.blur();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') clear();
        // przytrzymanie Q wstrzymuje rysowanie śladu
        if (e.key === 'q' || e.key === 'Q') paused = true;
      });
      document.addEventListener('keyup', function (e) {
        if (e.key === 'q' || e.key === 'Q') paused = false;
      });
      // po utracie fokusu keyup nie dotrze — nie zostawiaj wstrzymania na stałe
      window.addEventListener('blur', function () {
        paused = false;
      });

      resize();
      window.addEventListener('resize', resize);

      if (!enabled) return;

      window.addEventListener('pointermove', function (e) {
        draw(e.clientX, e.clientY);
      }, { passive: true });
      window.addEventListener('pointerdown', function (e) {
        last = { x: e.clientX, y: e.clientY };
      }, { passive: true });
      window.addEventListener('pointerleave', function () {
        last = null;
      });

      requestAnimationFrame(fade);
    })();
  </script>
</body>
</html>
