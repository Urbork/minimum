<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>minimum</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafaf8;
      --fg: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111110; --fg: #f2f2ef; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 18vw, 12rem);
      font-weight: 300;
      letter-spacing: -0.04em;
    }
    #trail {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      /* dzięki temu biały ślad jest widoczny na jasnym i ciemnym tle */
      mix-blend-mode: difference;
    }
  </style>
</head>
<body>
  <canvas id="trail"></canvas>
  <h1>minimum</h1>

  <script>
    (function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (reduce.matches) return;

      var canvas = document.getElementById('trail');
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var last = null;

      function resize() {
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#ffffff';
        last = null;
      }

      function draw(x, y) {
        if (last) {
          var dx = x - last.x;
          var dy = y - last.y;
          var speed = Math.sqrt(dx * dx + dy * dy);
          // szybszy ruch = cieńsza kreska
          ctx.lineWidth = Math.max(2, 14 - speed * 0.35);
          ctx.beginPath();
          ctx.moveTo(last.x, last.y);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
        last = { x: x, y: y };
      }

      function fade() {
        // powolne zanikanie — ślad zostaje przez kilka sekund
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fillStyle = 'rgba(0, 0, 0, 0.02)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
        requestAnimationFrame(fade);
      }

      window.addEventListener('resize', resize);
      window.addEventListener('pointermove', function (e) {
        draw(e.clientX, e.clientY);
      }, { passive: true });
      window.addEventListener('pointerdown', function (e) {
        last = { x: e.clientX, y: e.clientY };
      }, { passive: true });
      window.addEventListener('pointerleave', function () {
        last = null;
      });

      resize();
      requestAnimationFrame(fade);
    })();
  </script>
</body>
</html>
